<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liva</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .header {
      background: #6c4cff;
      color: white;
      padding: 30px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
    }

    .header p {
      font-size: 18px;
    }

    .box {
      background: white;
      margin: 30px 20px;
      padding: 30px 20px;
      border-radius: 18px;
    }

    button {
      background: #6c4cff;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Liva</h1>
    <p>Söhbət platformasına xoş gəlmisən!</p>
  </div>

  <div class="box">
    <h2>Salam 👋</h2>
    <p>Liva ilə yeni insanlarla tanış ol və söhbət et.</p>
    <button>Başla</button>
  </div>

</body>
</html>
